name: Build ResourcePackManager

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout ResourcePackManager
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Checkout MagmaCore
        uses: actions/checkout@v4
        with:
          repository: MagmaGuy/MagmaCore
          path: .deps/MagmaCore

      - name: Publish required MagmaCore modules to Maven Local
        working-directory: .deps/MagmaCore
        run: |
          chmod +x gradlew
          ./gradlew :core:publishToMavenLocal :nms:core:publishToMavenLocal --no-daemon

      - name: Build ResourcePackManager
        run: mvn -B -U -DskipTests package

      - name: Verify universal jar
        shell: bash
        run: |
          JAR="resourcepackmanager-bukkit/target/ResourcePackManager.jar"
          test -f "$JAR"
          echo "Built: $JAR"
          ls -lh "$JAR"

          jar tf "$JAR" | grep -q '^plugin.yml$'
          jar tf "$JAR" | grep -q '^velocity-plugin.json$'
          jar tf "$JAR" | grep -q '^bungee.yml$'
          jar tf "$JAR" | grep -q '^extension.yml$'

      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p dist
          cp resourcepackmanager-bukkit/target/ResourcePackManager.jar dist/ResourcePackManager.jar
          sha256sum dist/ResourcePackManager.jar > dist/ResourcePackManager.jar.sha256

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: ResourcePackManager
          path: |
            dist/ResourcePackManager.jar
            dist/ResourcePackManager.jar.sha256
          if-no-files-found: error
          retention-days: 30